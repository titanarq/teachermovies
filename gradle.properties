# -Xmx4g: packageDebug failed intermittently under Gradle's default heap once the native
# libVLC/jlibtorrent payloads are in the build (ADR-0004).
org.gradle.jvmargs=-Xmx4g
# A persistent daemon is shared by every worktree (~/.gradle -> /mnt/data/titan-cache/gradle) and
# outlives the run that started it inside teachermovies-guard.service's cgroup, where systemd keeps
# reporting it as a left-over process (#305). Expire it after 30 min idle, not Gradle's 3 h default.
org.gradle.daemon.idletimeout=1800000
android.useAndroidX=true
kotlin.code.style=official
