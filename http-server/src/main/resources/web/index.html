<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Movie Assistant</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <h1>MOVIE ASSISTANT</h1>
  <p id="conn" class="conn conn-off" role="status" aria-live="polite">TV <span class="dot" aria-hidden="true">●</span> <span id="conn-text">desconectada</span></p>
</header>

<main>
  <section id="pair" class="card" hidden>
    <h2>Emparejar con la TV</h2>
    <p class="hint">Introduce el PIN de 6 cifras que muestra la TV.</p>
    <form id="pair-form" autocomplete="off">
      <label for="pin" class="visually-hidden">PIN</label>
      <input id="pin" name="pin" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
             placeholder="PIN" required>
      <button type="submit" class="btn btn-primary">EMPAREJAR</button>
    </form>
    <p id="pair-msg" class="msg" role="alert"></p>
  </section>

  <section id="app" hidden>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button id="tab-downloads" type="button" class="tab" role="tab" aria-selected="true"
              aria-controls="view-downloads">DESCARGAS</button>
      <button id="tab-logs" type="button" class="tab" role="tab" aria-selected="false"
              aria-controls="view-logs">REGISTROS</button>
    </nav>

    <div id="view-downloads" role="tabpanel" aria-labelledby="tab-downloads">
      <div class="card">
        <label for="magnet" class="visually-hidden">Magnet</label>
        <textarea id="magnet" rows="3" placeholder="Pega aquí magnet o enlace" spellcheck="false"
                  autocapitalize="off" autocomplete="off"></textarea>
        <div class="actions">
          <button id="send" type="button" class="btn btn-primary">ENVIAR A LA TV</button>
          <span class="or">o</span>
          <button id="upload" type="button" class="btn">SUBIR .TORRENT</button>
          <input id="file" type="file" accept=".torrent,application/x-bittorrent" hidden>
        </div>
        <p id="send-msg" class="msg" role="status" aria-live="polite"></p>
      </div>

      <section class="card">
        <h2>DESCARGANDO</h2>
        <ul id="list" class="list"></ul>
        <p id="empty" class="hint">No hay descargas.</p>
      </section>
    </div>

    <section id="view-logs" class="card" role="tabpanel" aria-labelledby="tab-logs" hidden>
      <h2>REGISTROS DE LA TV</h2>
      <div class="actions logs-actions">
        <label for="log-level" class="visually-hidden">Nivel</label>
        <select id="log-level">
          <option value="debug">Todo (debug)</option>
          <option value="info" selected>Info y superior</option>
          <option value="warn">Avisos y errores</option>
          <option value="error">Solo errores</option>
        </select>
        <button id="log-follow" type="button" class="btn" aria-pressed="false">PAUSAR</button>
        <button id="log-download" type="button" class="btn">DESCARGAR .TXT</button>
      </div>
      <p id="log-msg" class="msg" role="status" aria-live="polite"></p>
      <div id="log-lines" class="log-lines" tabindex="0" role="log" aria-label="Registros"></div>
    </section>
  </section>
  <dialog id="del-dialog" class="card dialog" aria-labelledby="del-title">
    <form method="dialog">
      <h2 id="del-title">¿Borrar esta descarga?</h2>
      <p id="del-name" class="name"></p>
      <label class="check"><input id="del-files" type="checkbox"> Borrar también los archivos</label>
      <div class="actions">
        <button type="submit" value="cancel" class="btn">CANCELAR</button>
        <button type="submit" value="ok" class="btn btn-danger-solid">BORRAR</button>
      </div>
    </form>
  </dialog>
</main>

<script src="/static/app.js" defer></script>
</body>
</html>
