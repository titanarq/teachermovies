# agent OS host configuration for teachermovies. Shape and meaning of every key:
# agent_os/config.example.yaml and agent_os/docs/AGENT_OS.md §4.2. Modeled on roedor's own
# config/agents.yaml. Nothing under agent_os/ is edited; this file is how the host extends it.
project:
  repo: titanarq/teachermovies
  tracking_epic: 1                 # "Tracking: teachermovies agent OS"; status:agents-paused on it is the full stop
  board_number: 2                  # https://github.com/orgs/titanarq/projects/2 (node id PVT_kwDOE5nIKc4Bkev2)
  secrets_dir: .secrets/gh_apps    # <slug>.json + <slug>.pem per GitHub App identity
  # The roedor-* Apps are installed org-wide on titanarq ("all repositories"), so they cover this
  # repo too. Dedicated teachermovies-* Apps can replace them later by renaming these slugs.
  planner_app: roedor-planner
  guard_unit: teachermovies-guard
  module_docs_dir: docs/modules
  human_login: MatillaM
  human_language: Spanish
  notify_topic_file: .secrets/ntfy_topic
  messages:
    review_ready: "[teachermovies] Revisión pendiente: la incidencia #{issue} «{title}» está aprobada y solo falta que la fusiones — {url}"
    quota_exhausted_no_fallback: "[teachermovies] Claude sin cupo y la incidencia #{issue} no admite Qwen de respaldo (clase «{task_class}», backend {backend}): no puede avanzar sin ti"
    planner_run_cap_reached: "[teachermovies] El planificador ha agotado su tope diario de ejecuciones ({runs}/{cap}) y no despachará nada más hoy; {pending} evento(s) esperan a mañana: {context}"
    backend_worktree_missing: "[teachermovies] Backend sin worktree: {backend} no tiene worktree en {worktree} y {issue_count} incidencia(s) lista(s) no pueden avanzar hasta que la crees"
    unreviewed_pull_request: "[teachermovies] Revisión perdida: la PR #{pr} de la incidencia #{issue} no tiene revisión ni un {role} en marcha — puede haber muerto sin dejar rastro"
  test_command: scripts/test.sh
  prompt_extras:
    worker: config/agent_prompts/worker.md
    refiner: config/agent_prompts/refiner.md
  # Names render into the worker prompt; values are exported to the backend process (no secrets here).
  worker_environment:
    ANDROID_HOME: /home/titan/Android/Sdk
    ANDROID_SDK_ROOT: /home/titan/Android/Sdk
  forbidden_paths:
    - AGENTS.md
    - CLAUDE.md
    - docs/VISION.md
    - docs/adr/*
    - config/agents.yaml
    - config/agent_prompts/*
    - gradle/wrapper/*
    - "*.jks"
    - "*.keystore"
    - keystore.properties
  merge_audit_exempt_paths:
    - docs/adr/*
  never_run:
    - command: connectedAndroidTest
      reason: needs a device or emulator the worker host does not have, and hangs waiting for one
    - command: adb
      reason: would act on whatever physical TV or phone is attached to this machine
    - command: sdkmanager
      reason: installs or removes SDK packages machine-wide for every checkout, including other projects'
    - command: "push --force"
      reason: rewrites shared history other clones have already built work on top of
  backends:
    qwen:
      command: /home/titan/.nvm/versions/node/v22.22.0/bin/qwen
      worktree: ../teachermovies-qwen
      app: roedor-qwen
      stream: qwen_jsonl
      quota: none
    claude:
      command: /home/titan/.local/bin/claude
      worktree: ../teachermovies-claude
      app: roedor-claude
      stream: claude_jsonl
      quota: claude_rate_limit
  executables:
    gh: /home/linuxbrew/.linuxbrew/bin/gh
  role_apps: {}
  modules:
    - app-tv
    - core-model
    - torrent
    - storage
    - http-server
    - player
    - assistant
    - discovery
    - mobile-app
    - infra
  labels:
    refine: status:refine
    ready: status:ready
    doing: status:doing
    blocked_on_human: status:blocked-on-human
    ai_completed: status:ai-completed
    review: status:review
    agents_paused: status:agents-paused
    auto_ready: auto-ready
    wake_planner: wake:planner
  board_columns:
    refine: Backlog
    ready: Ready for AI
    doing: In progress
    blocked-on-human: null
    ai-completed: AI completed
    review: Review
    done: Done

mechanism:
  own_paths:
    - agent_os/*
    - scripts/worker_task.sh
    - scripts/agent_task.sh
    - scripts/planner_task.sh
    - scripts/worker_progress.sh
    - scripts/notify.sh
    - scripts/qwen_task.sh
    - scripts/agent_guard.py
    - scripts/agent_lib.py
    - scripts/issues.py
    - scripts/gh_app_token.py
    - .claude/*
  quota_verdict_ttl_minutes: 60

planner:
  idle_wake_minutes: 120
  max_runs_per_day: 40   # raised 2026-09-24 (spend unrestricted until 17:00); revert to 20 after
  relaunch_cap: 3
  max_parallel_issues: 1
  reconcile_closed_lookback_days: 30
  # Reviewed the refiner's dry run on #29/#81-#83 (2026-09-24); unattended from here on
  # (agent_os/docs/adr/2026-09-15-the-refiner-runs-unattended-only-after-a-human-reviewed-its-dry-run.md).
  refiner_unattended: true

classes:
  mechanical-qwen:
    backend: claude   # was qwen; switched 2026-09-24 (Claude budget to spend before 17:00) -- revert after
    model: claude-opus-5
    max_context: 400000
    max_cost_usd: 5.0
    max_total_tokens: 80000000
    commit_warn_turns: 25
    commit_cut_turns: 90
    qwen_fallback_eligible: false
  complex-qwen:
    backend: claude   # was qwen; switched 2026-09-24 (Claude budget to spend before 17:00) -- revert after
    model: claude-opus-5
    max_context: 800000
    max_cost_usd: 20.0
    max_total_tokens: 150000000
    commit_warn_turns: 25
    commit_cut_turns: 90
    qwen_fallback_eligible: false
  planner:
    role: planner
    backend: claude
    model: claude-opus-5
    max_context: 40000
    max_cost_usd: 2.0
    max_total_tokens: 2000000
    commit_warn_turns: 30
    commit_cut_turns: 50
    qwen_fallback_eligible: false
    fallback:
      backend: qwen
      model: qwen3.8-max
      ceilings: [max_context, max_total_tokens]
  validator:
    role: validator
    backend: claude
    model: claude-opus-5
    max_context: 200000
    max_cost_usd: 5.0
    max_total_tokens: 10000000
    commit_warn_turns: 30
    commit_cut_turns: 50
    qwen_fallback_eligible: false
    fallback:
      backend: qwen
      model: qwen3.8-max
      ceilings: [max_context, max_total_tokens]
  refiner:
    role: refiner
    backend: claude
    model: claude-opus-5
    max_context: 200000
    max_cost_usd: 5.0
    max_total_tokens: 10000000
    commit_warn_turns: 30
    commit_cut_turns: 50
    qwen_fallback_eligible: false
    fallback:
      backend: qwen
      model: qwen3.8-max
      ceilings: [max_context, max_total_tokens]
