# Single source of truth for every version in the build (AGENTS.md "Kotlin / Android conventions").
# No version literal may appear in any build.gradle.kts; the one exception is the foojay resolver
# plugin in settings.gradle.kts, because Gradle evaluates pluginManagement before this file loads.
# Versions are fixed by docs/adr/0004-build-toolchain-versions.md; changing one means updating (or
# superseding) the ADR.

[versions]
agp = "8.6.1"
kotlin = "2.1.21"
ksp = "2.1.21-2.0.2"
# Built with Kotlin 2.1, so it matches the toolchain above. ADR-0004's table has no row for it
# yet and needs one.
coroutines = "1.10.2"
foojayResolver = "0.8.0" # applied from settings.gradle.kts, which cannot read this catalog
coreKtx = "1.16.0"
lifecycle = "2.9.4"
activityCompose = "1.10.1"
composeBom = "2025.08.00"
tvMaterial = "1.1.0"
room = "2.7.2"
datastore = "1.1.7"
ktor = "3.1.3"
jlibtorrent = "2.0.12.9"
libvlc = "3.7.2"
junit = "4.13.2"
# Room DAO tests on the JVM (#40). ADR-0004 has no row for these yet and needs one.
robolectric = "4.14.1"
androidxTestCore = "1.6.1"

[libraries]
# :app-tv (Compose for TV UI -- #44)
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }

# Every module: coroutines + Flow/StateFlow is the concurrency model (AGENTS.md); the test artifact
# is what gives the JVM tests `runTest`.
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# :core-model (Room metadata -- #40, DataStore settings -- #41)
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# :http-server (ADR-0002: Ktor CIO, SSE, in-process test host)
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
ktor-server-sse = { group = "io.ktor", name = "ktor-server-sse", version.ref = "ktor" }
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host", version.ref = "ktor" }

# Native libraries (ADR-0001): :torrent -- #51, :player -- #75
jlibtorrent = { group = "com.frostwire", name = "jlibtorrent", version.ref = "jlibtorrent" }
jlibtorrent-android-arm = { group = "com.frostwire", name = "jlibtorrent-android-arm", version.ref = "jlibtorrent" }
jlibtorrent-android-arm64 = { group = "com.frostwire", name = "jlibtorrent-android-arm64", version.ref = "jlibtorrent" }
jlibtorrent-android-x64 = { group = "com.frostwire", name = "jlibtorrent-android-x86_64", version.ref = "jlibtorrent" }
libvlc-all = { group = "org.videolan.android", name = "libvlc-all", version.ref = "libvlc" }

# Tests: JVM only (src/test), fakes over mocks (AGENTS.md)
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
